<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="normalize.css">
        <link rel="stylesheet" href="style.css">
        <title>Slot Machine</title>
    </head>
    <body>
        <h1>Slot Machine</h1>
        <section class="reelContainer">
            <div id="moneyDisplay">$1000</div>
            <div class="divRow">
                <span class="reel"></span>
                <span class="reel"></span>
                <span class="reel"></span>
            </div>
        </section>
        <div class="bottomSection">
            <button class="betButton" id="maxBet">Max Bet: $50</button>
            <button class="betButton" id="minBet">Min Bet: $1</button>
        </div>
        <p id="message"></p>
         <script src="main.js"></script>
    </body>
</html>
